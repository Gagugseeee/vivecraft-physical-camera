
name: Build VR Physical Camera JAR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Build mod
        run: gradle --no-daemon --stacktrace build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: VR-Physical-Camera-JAR
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
